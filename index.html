<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon - Multiple formats for best browser compatibility -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="256x256" href="/favicon-256x256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Cache busting -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Build version for automatic cache refresh -->
    <meta name="build-version" content="BUILD_TIMESTAMP_PLACEHOLDER" />

    <title>Disruptors AI Marketing Hub</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFD700" />
    <meta name="description" content="AI-Powered Marketing Platform with Presentation Mode for instant offline access" />

    <!-- Performance: Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://ubqxflzuvxowigbjmqfb.supabase.co" crossorigin>
    <link rel="preconnect" href="https://api.openai.com" crossorigin>
    <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

    <!-- Performance: DNS prefetch for other services -->
    <link rel="dns-prefetch" href="https://api.replicate.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://prod.spline.design">
    <link rel="dns-prefetch" href="https://unpkg.com">
  </head>
  <body>
    <div id="root"></div>

    <!-- 🔧 HOTFIX: Prevent infinite reload loop -->
    <script src="/cache-fix.js"></script>

    <!-- 🔍 DEBUG: Monitor chunk loading and errors -->
    <script>
      console.log('🔵 [INDEX.HTML] Page load started - timestamp:', new Date().toISOString());

      // Track all script loads
      const scriptLoadOrder = [];
      const originalCreateElement = document.createElement;
      document.createElement = function(tagName) {
        const element = originalCreateElement.call(document, tagName);
        if (tagName.toLowerCase() === 'script') {
          element.addEventListener('load', function() {
            const src = this.src || this.innerHTML.substring(0, 50);
            scriptLoadOrder.push({ src, time: Date.now() });
            console.log('📦 [SCRIPT LOADED]', scriptLoadOrder.length, ':', src.split('/').pop());
          });
          element.addEventListener('error', function() {
            console.error('❌ [SCRIPT ERROR]', this.src);
          });
        }
        return element;
      };

      // Track errors
      window.addEventListener('error', function(e) {
        console.error('❌ [GLOBAL ERROR]', e.message, 'at', e.filename, 'line', e.lineno);
        if (e.message.includes('forwardRef')) {
          console.error('🚨 [CRITICAL] ForwardRef error detected!');
          console.error('🚨 Script load order:', scriptLoadOrder);
        }
      });

      // Track React availability
      const checkReact = setInterval(function() {
        if (typeof React !== 'undefined') {
          console.log('✅ [REACT DETECTED] React is now globally available');
          console.log('✅ React.version:', React.version);
          clearInterval(checkReact);
        }
      }, 100);

      setTimeout(function() {
        clearInterval(checkReact);
        console.log('🔍 [DEBUG] Final script load order:', scriptLoadOrder);
      }, 5000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
