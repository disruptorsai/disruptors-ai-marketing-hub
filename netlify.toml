[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  PLAYWRIGHT_BROWSERS_PATH = "0"
  # Increase Node memory for large builds (70+ lazy-loaded routes)
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Enable verbose logging for build diagnosis
  CI = "true"

# Admin Nexus & Growth Audit Functions Configuration
[functions]
  node_bundler = "esbuild"
  # Increase timeout for AI content generation (local dev)
  [functions."admin-blog-generator"]
    timeout = 120
  [functions."admin-image-generator"]
    timeout = 60
  [functions."change-request-analyze"]
    timeout = 60
  external_node_modules = [
    "@ai-sdk/openai",
    "@ai-sdk/anthropic",
    "chromium-bidi",
    "playwright-core",
    "playwright",
    "@mendable/firecrawl-js",
    "node-vibrant",
    "ai",
    "culori"
  ]

# Exception for sitemap.xml - serve as static file
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

# Exception for robots.txt - serve as static file
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# SPA fallback - redirect everything else to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https://*.supabase.co https://api.openai.com https://api.replicate.com https://api.elevenlabs.io https://api.anthropic.com https://generativelanguage.googleapis.com https://sheets.googleapis.com https://res.cloudinary.com https://prod.spline.design https://api.firecrawl.dev https://www.googleapis.com https://api.brandfetch.com https://api.dataforseo.com https://fonts.gstatic.com https://services.leadconnectorhq.com https://api.leadconnectorhq.com https://*.gohighlevel.com wss://*.supabase.co; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://services.leadconnectorhq.com https://api.leadconnectorhq.com https://*.gohighlevel.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# SEO files - cache for 1 day but allow revalidation
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400, must-revalidate"